name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.22'
  CGO_ENABLED: '0'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Run gofmt check
        run: |
          echo "Checking formatting..."
          gofmt -l ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run gosec security scanner
        uses: securego/gosec@master
        with:
          args: ./...

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build opx
        run: |
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "local")
          DATE=$(date +%Y-%m-%d)
          go build -buildvcs=false \
            -ldflags "-s -w -X main.version=1.0.0 -X main.commit=$COMMIT -X main.date=$DATE" \
            -o opx-linux-${{ matrix.arch }} ./cmd/op
          echo "Build output: ${{ github.sha }}-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opx-linux-${{ matrix.arch }}
          path: opx-linux-${{ matrix.arch }}

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build opx
        shell: pwsh
        run: |
          $commit = git rev-parse --short HEAD
          $date = Get-Date -Format 'yyyy-MM-dd'
          go build -buildvcs=false `
            -ldflags "-s -w -X main.version=1.0.0 -X main.commit=$commit -X main.date=$date" `
            -o opx.exe ./cmd/op
          Write-Host "Built opx.exe ($commit)"

      - name: Sign binary (if certificate available)
        shell: pwsh
        run: |
          $pfxPath = "$env:SIGNING_CERT_PATH"
          $pfxPass = $env:SIGNING_CERT_PASSWORD
          if ($pfxPath -and (Test-Path $pfxPath)) {
            signtool sign /f $pfxPath /p $pfxPass `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 opx.exe
          } else {
            Write-Warning "No signing certificate found - skipping signature"
          }
        env:
          SIGNING_CERT_PATH: ${{ secrets.SIGNING_CERT_PATH }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opx-windows
          path: opx.exe

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests with coverage
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
        env:
          GOCOVERDIR: coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false

      - name: Race detector check
        run: go test -race ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, build-linux, build-windows, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release archive
        run: |
          cd artifacts
          tar -czf opx-${{ github.ref_name }}.tar.gz \
            $(find . -type f -not -path '*/.*' | sed 's|^\./||')

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/opx-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
